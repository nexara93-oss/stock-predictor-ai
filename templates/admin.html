<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel - Stock Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d13;
            --panel: #12171f;
            --panel-2: #171d27;
            --panel-3: #1e2531;
            --brd: rgba(255,255,255,0.06);
            --brd-2: rgba(255,255,255,0.12);
            --text: #e8eaf0;
            --text-2: #8b93a5;
            --text-3: #5a6175;
            --accent: #5DD62C;
            --accent-2: #3fbf1a;
            --red: #ff5a6a;
            --green: #5DD62C;
            --gold: #f0b90b;
            --blue: #4d8dff;
            --cyan: #22d3ee;
            --up-a: rgba(93,214,44,0.14);
            --up-b: rgba(93,214,44,0.40);
            --dn-a: rgba(255,90,106,0.12);
            --dn-b: rgba(255,90,106,0.40);
            --shadow: 0 10px 34px rgba(0,0,0,0.42);
            --shadow-soft: 0 6px 22px rgba(0,0,0,0.30);
            --r-lg: 22px;
            --r-md: 16px;
            --r-sm: 11px;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Inter', system-ui, sans-serif;
            --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--sans);
            background:
                radial-gradient(1100px 520px at 6% -8%, rgba(93,214,44,0.10), transparent 60%),
                radial-gradient(950px 500px at 100% -4%, rgba(77,141,255,0.10), transparent 60%),
                radial-gradient(1100px 640px at 50% 118%, rgba(139,92,246,0.09), transparent 62%),
                var(--bg);
            color: var(--text); min-height: 100vh;
            -webkit-font-smoothing: antialiased; font-size: 13.5px;
        }
        ::selection { background: rgba(93,214,44,0.30); color: #fff; }
        ::-webkit-scrollbar { width: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--brd-2); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .soft {
            background: linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-soft);
        }

        .container { max-width: 760px; margin: 0 auto; padding: 30px 18px 60px; }

        .admin-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 14px; flex-wrap: wrap; margin-bottom: 10px;
            padding: 16px 20px;
            background:
                radial-gradient(500px 140px at 0% 0%, rgba(93,214,44,0.16), transparent 62%),
                linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-radius: var(--r-lg); box-shadow: var(--shadow);
        }
        .admin-brand { display: flex; align-items: center; gap: 12px; }
        .logo-mark {
            width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0;
            background: linear-gradient(135deg, rgba(93,214,44,0.28), rgba(93,214,44,0.06));
            box-shadow: 0 8px 22px rgba(93,214,44,0.22);
            display: grid; place-items: center;
        }
        h1 {
            font-family: var(--display); font-size: 1.1rem; font-weight: 700;
            letter-spacing: 0.5px; color: var(--text); text-transform: uppercase;
        }
        h1 em {
            font-style: normal;
            background: linear-gradient(90deg, var(--accent), var(--cyan));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .admin-sub {
            display: block; font-family: var(--mono); font-size: 8.5px;
            color: var(--text-3); letter-spacing: 2px; margin-top: 4px; text-transform: uppercase;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 16px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
            background: rgba(255,255,255,0.06); color: var(--text-2);
            text-decoration: none; transition: 0.18s;
            font-family: var(--mono); letter-spacing: 0.6px; text-transform: uppercase;
        }
        .back-link:hover { color: var(--accent); background: var(--up-a); transform: translateY(-2px); }

        .section-label {
            font-family: var(--mono); font-size: 10px; font-weight: 700;
            color: var(--text-3); text-transform: uppercase; letter-spacing: 1.8px;
            margin: 26px 0 11px; display: flex; align-items: center; gap: 10px;
        }
        .section-label::before { content: ''; width: 4px; height: 14px; background: var(--accent); border-radius: 4px; }
        .section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--brd-2), transparent); }

        .panel { padding: 20px; transition: transform 0.22s, box-shadow 0.22s; }
        .panel:hover { transform: translateY(-3px); box-shadow: var(--shadow); }

        .form-row { display: flex; gap: 9px; margin-bottom: 13px; flex-wrap: wrap; }
        .form-row input, .form-row select {
            flex: 1; min-width: 140px; padding: 12px 16px; border-radius: 999px;
            border: none; background: rgba(0,0,0,0.30); color: var(--text);
            font-family: var(--mono); font-size: 13px; outline: none; transition: 0.18s;
        }
        .form-row input::placeholder { color: var(--text-3); }
        .form-row input:focus, .form-row select:focus {
            box-shadow: 0 0 0 3px rgba(93,214,44,0.22); background: rgba(0,0,0,0.38);
        }
        .form-row select { flex: 0 0 116px; cursor: pointer; }
        .form-row select option { background: #12171f; color: #e8eaf0; }

        .btn {
            padding: 12px 20px; border-radius: 999px; border: none; font-family: var(--sans);
            font-size: 12.5px; font-weight: 700; cursor: pointer; transition: 0.18s;
            letter-spacing: 0.4px;
        }
        .btn:active { transform: translateY(1px); }
        .btn-green {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #06120a; box-shadow: 0 10px 26px rgba(93,214,44,0.30);
        }
        .btn-green:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(93,214,44,0.40); }
        .btn-red { background: var(--dn-a); color: var(--red); }
        .btn-red:hover { background: rgba(255,90,106,0.22); }
        .btn-outline { background: rgba(255,255,255,0.06); color: var(--text-2); }
        .btn-outline:hover { background: var(--up-a); color: var(--accent); }

        .ann-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border-radius: 999px; margin-bottom: 8px;
            background: rgba(255,255,255,0.045);
            transition: 0.18s; animation: rise 0.25s ease-out both;
        }
        .ann-item:hover { background: rgba(255,255,255,0.08); transform: translateX(4px); }
        @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
        .ann-item .text { flex: 1; font-size: 13px; font-family: var(--mono); }
        .ann-item .color-dot {
            width: 11px; height: 11px; border-radius: 4px; flex-shrink: 0;
            box-shadow: 0 0 10px currentColor;
        }

        .counter-row { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
        .counter-val {
            font-family: var(--mono); font-size: 1.7rem; color: var(--accent);
            font-weight: 700; text-shadow: 0 0 26px rgba(93,214,44,0.45);
        }
        .toggle { position: relative; width: 46px; height: 25px; cursor: pointer; flex-shrink: 0; display: inline-block; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle .slider {
            position: absolute; inset: 0; background: rgba(255,255,255,0.09);
            border-radius: 999px; transition: 0.28s;
        }
        .toggle .slider::before {
            content: ''; position: absolute; width: 19px; height: 19px;
            border-radius: 50%; background: var(--text-3); top: 3px; left: 3px; transition: 0.28s;
        }
        .toggle input:checked + .slider {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 4px 16px rgba(93,214,44,0.40);
        }
        .toggle input:checked + .slider::before { transform: translateX(21px); background: #06120a; }
        .toggle-label { font-size: 13px; color: var(--text-2); }

        .pw-row { display: flex; gap: 9px; flex-wrap: wrap; }
        .pw-row input {
            flex: 1; min-width: 180px; padding: 12px 16px; border-radius: 999px;
            border: none; background: rgba(0,0,0,0.30); color: var(--text);
            font-family: var(--mono); font-size: 13px; outline: none; transition: 0.18s;
        }
        .pw-row input::placeholder { color: var(--text-3); }
        .pw-row input:focus { box-shadow: 0 0 0 3px rgba(93,214,44,0.22); background: rgba(0,0,0,0.38); }

        .msg {
            padding: 11px 16px; border-radius: 999px; font-family: var(--mono);
            font-size: 12px; margin-top: 13px; display: none;
            animation: rise 0.22s ease-out; letter-spacing: 0.5px;
        }
        .msg.ok { display: block; background: var(--up-a); color: var(--green); }
        .msg.err { display: block; background: var(--dn-a); color: var(--red); }
        .empty {
            color: var(--text-3); font-size: 12px; font-family: var(--mono);
            text-align: center; padding: 22px; border-radius: var(--r-md);
            background: rgba(255,255,255,0.04); letter-spacing: 0.6px;
        }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-head">
            <div class="admin-brand">
                <span class="logo-mark">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5DD62C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </span>
                <span>
                    <h1>Admin <em>Panel</em></h1>
                    <span class="admin-sub">Stock Predictor Control Center</span>
                </span>
            </div>
            <a href="/" class="back-link">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to site
            </a>
        </div>

        <div class="section-label">📢 Announcements</div>
        <div class="panel soft">
            <div class="form-row">
                <input type="text" id="annText" placeholder="Announcement text...">
                <select id="annColor">
                    <option value="green">Green</option>
                    <option value="red">Red</option>
                    <option value="blue">Blue</option>
                    <option value="gold">Gold</option>
                </select>
                <button class="btn btn-green" onclick="addAnnouncement()">Add</button>
            </div>
            <div id="annList"></div>
            <div class="msg" id="annMsg"></div>
        </div>

        <div class="section-label">🔢 Visitor Counter</div>
        <div class="panel soft">
            <div style="display:flex;align-items:center;gap:12px;">
                <label class="toggle">
                    <input type="checkbox" id="counterEnabled">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label">Show counter on page</span>
            </div>
            <div class="counter-row">
                <span class="toggle-label">Visitors:</span>
                <span class="counter-val" id="counterVal">0</span>
            </div>
            <div style="margin-top:15px;">
                <button class="btn btn-outline" onclick="resetCounter()">Reset to 0</button>
            </div>
            <div class="msg" id="counterMsg"></div>
        </div>

        <div class="section-label">🔑 Change Password</div>
        <div class="panel soft">
            <div class="pw-row">
                <input type="password" id="newPw" placeholder="New password (8+ chars)">
                <button class="btn btn-green" onclick="changePw()">Change</button>
            </div>
            <div class="msg" id="pwMsg"></div>
        </div>
    </div>

    <script>
        const API = '';

        async function auth() {
            return { 'Authorization': 'Basic ' + btoa('admin:' + localStorage.getItem('adminPw') || '') };
        }

        async function apiFetch(url, opts = {}) {
            const pw = localStorage.getItem('adminPw') || '';
            const headers = { 'Authorization': 'Basic ' + btoa('admin:' + pw), ...opts.headers };
            if (opts.body && typeof opts.body === 'object') {
                headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(opts.body);
            }
            return fetch(API + url, { ...opts, headers });
        }

        function showMsg(id, text, ok) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg ' + (ok ? 'ok' : 'err');
            setTimeout(() => el.className = 'msg', 3000);
        }

        const COLOR_HEX = { green: '#5DD62C', red: '#ff5a6a', blue: '#4d8dff', gold: '#f0b90b' };

        async function loadAnnouncements() {
            const r = await apiFetch('/api/admin/announcements');
            if (!r.ok) return;
            const data = await r.json();
            const list = document.getElementById('annList');
            if (data.length === 0) {
                list.innerHTML = '<div class="empty">No announcements</div>';
                return;
            }
            list.innerHTML = data.map(a => `
                <div class="ann-item">
                    <div class="color-dot" style="background:${COLOR_HEX[a.color] || a.color};color:${COLOR_HEX[a.color] || a.color}"></div>
                    <span class="text">${a.text}</span>
                    <button class="btn btn-red" style="padding:5px 12px;font-size:0.7rem;" onclick="deleteAnn(${a.id})">✕</button>
                </div>
            `).join('');
        }

        async function addAnnouncement() {
            const text = document.getElementById('annText').value.trim();
            const color = document.getElementById('annColor').value;
            if (!text) return;
            const r = await apiFetch('/api/admin/announcements', { method: 'POST', body: { text, color } });
            if (r.ok) {
                document.getElementById('annText').value = '';
                showMsg('annMsg', 'Added!', true);
                loadAnnouncements();
            } else {
                showMsg('annMsg', 'Error', false);
            }
        }

        async function deleteAnn(id) {
            await apiFetch('/api/admin/announcements/' + id, { method: 'DELETE' });
            loadAnnouncements();
        }

        async function loadCounter() {
            const r = await apiFetch('/api/admin/counter');
            if (!r.ok) return;
            const data = await r.json();
            document.getElementById('counterEnabled').checked = data.enabled || false;
            document.getElementById('counterVal').textContent = data.count || 0;
        }

        document.getElementById('counterEnabled').addEventListener('change', async function() {
            const r = await apiFetch('/api/admin/counter', {
                method: 'POST',
                body: { enabled: this.checked, count: parseInt(document.getElementById('counterVal').textContent) || 0 }
            });
            showMsg('counterMsg', r.ok ? 'Saved' : 'Error', r.ok);
        });

        async function resetCounter() {
            await apiFetch('/api/admin/counter', {
                method: 'POST',
                body: { enabled: document.getElementById('counterEnabled').checked, count: 0 }
            });
            document.getElementById('counterVal').textContent = '0';
            showMsg('counterMsg', 'Reset to 0', true);
        }

        async function changePw() {
            const pw = document.getElementById('newPw').value;
            if (pw.length < 8) { showMsg('pwMsg', 'Must be 8+ characters', false); return; }
            const r = await apiFetch('/api/admin/change-password', { method: 'POST', body: { password: pw } });
            if (r.ok) {
                localStorage.setItem('adminPw', pw);
                document.getElementById('newPw').value = '';
                showMsg('pwMsg', 'Password changed!', true);
            } else {
                showMsg('pwMsg', 'Error', false);
            }
        }

        (async function init() {
            if (!localStorage.getItem('adminPw')) {
                const pw = prompt('Enter admin password:');
                if (!pw) { window.location = '/'; return; }
                localStorage.setItem('adminPw', pw);
            }
            const r = await apiFetch('/api/admin/announcements');
            if (!r.ok) {
                localStorage.removeItem('adminPw');
                alert('Wrong password');
                window.location = '/';
                return;
            }
            loadAnnouncements();
            loadCounter();
        })();
    </script>
</body>
</html>
